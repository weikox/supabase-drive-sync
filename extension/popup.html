<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
body{font:14px system-ui,sans-serif;width:300px;margin:0;padding:14px;background:#18181b;color:#fafafa}
h1{font-size:15px;margin:0 0 10px}
textarea{width:100%;box-sizing:border-box;height:60px;font:12px monospace;background:#27272a;color:#fafafa;border:1px solid #3f3f46;border-radius:6px;padding:6px}
button{width:100%;margin-top:8px;padding:9px;border:0;border-radius:8px;background:#f97316;color:#fff;font-weight:600;cursor:pointer}
button.sec{background:#3f3f46}
p{color:#a1a1aa;font-size:12px;margin:8px 0 0}
</style></head>
<body>
<h1>Facturas Curenergía</h1>
<div id="setup">
  <p>Pega el código de conexión que aparece en la app (pestaña Curenergía):</p>
  <textarea id="code"></textarea>
  <button id="save">Guardar código</button>
</div>
<div id="ready" hidden>
  <button id="sync">Sincronizar luz y gas</button>
  <button id="reset" class="sec">Cambiar código</button>
  <p>Abre curenergia.es con tu sesión iniciada antes de pulsar.</p>
</div>
<p id="msg"></p>
<script src="popup.js"></script>
</body></html>
